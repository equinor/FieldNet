<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0e1117;color:#f3f5f7;font:13px system-ui;overflow:hidden}.toolbar{height:50px;display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid #343a43;background:#141922}.toolbar button{background:#202733;color:#fff;border:1px solid #46505f;border-radius:6px;padding:6px 9px;cursor:pointer}.toolbar .sp{flex:1}.wrap{display:flex;height:800px}.palette{width:158px;border-right:1px solid #343a43;padding:8px;background:#11161e;overflow:auto}.palette button{width:100%;margin:3px 0;text-align:left;background:#202733;color:#fff;border:1px solid #46505f;border-radius:5px;padding:5px}.canvas{position:relative;flex:1;overflow:auto;background-image:radial-gradient(#303844 1px,transparent 1px);background-size:20px 20px}.world{position:relative;width:2400px;height:1600px;transform-origin:0 0}.node{position:absolute;width:164px;min-height:76px;padding:9px 12px;border:1px solid #5b6675;border-radius:9px;background:#1a202a;box-shadow:0 3px 10px #0009;cursor:move;z-index:3}.node.sel{outline:2px solid #67b7ff}.kind{font-size:9px;letter-spacing:.7px;text-transform:uppercase;opacity:.65}.result{margin-top:5px;color:#8dd3ff;font-size:11px}.port{position:absolute;width:12px;height:12px;border-radius:50%;background:#e9edf2;border:2px solid #59697d;top:31px;cursor:crosshair}.pin{left:-7px}.pout{right:-7px}.connecting{background:#ffcc66}.edge{stroke:#8ca9ff;stroke-width:2;fill:none;pointer-events:stroke;cursor:pointer}.edge.sel{stroke:#ffcc66;stroke-width:4}.edgeText{fill:#d8dee9;font-size:10px;pointer-events:none}.status{position:fixed;left:175px;bottom:10px;background:#151b24ee;border:1px solid #394453;border-radius:6px;padding:6px 9px;z-index:8;max-width:65%}.hint{opacity:.65;font-size:11px}.zoom{min-width:48px;text-align:center}.solved{color:#8ee59b}.failed{color:#ff8c8c}.unsolved{color:#ffd27d}svg{position:absolute;inset:0;z-index:1;overflow:visible}
</style></head><body>
<div class="toolbar"><b>FieldNet Engineering Editor</b><button id="del">Delete</button><button id="copy">Copy</button><button id="undo">Undo</button><button id="redo">Redo</button><span class="sp"></span><button id="zout">−</button><span id="zlabel" class="zoom">100%</span><button id="zin">+</button><button id="fit">Fit</button><button id="reset">Reset view</button><span class="hint">Click OUT then click target IN port • Shift+drag background to pan</span></div>
<div class="wrap"><div class="palette"><b>Add component</b><div id="pal"></div></div><div id="canvas" class="canvas"><div id="world" class="world"><svg id="svg"></svg></div><div id="status" class="status unsolved">UNSOLVED</div></div></div>
<script>
const TYPES=[['reservoir','Reservoir tank'],['well','Production well'],['manifold','Manifold'],['separator','Separator'],['separator_stage','Separator stage'],['water_source','Water source'],['gas_source','Gas source'],['water_injector','Water injector'],['gas_injector','Gas injector'],['oil_export','Oil export'],['gas_export','Gas export'],['water_disposal','Water disposal'],['sink','Pressure sink']];
let state={nodes:[],edges:[],p:{},q:{},solve:{status:'UNSOLVED'},viewport:{zoom:1,scrollLeft:0,scrollTop:0}},selected=null,connectFrom=null,undo=[],redo=[];const c=document.getElementById('canvas'),world=document.getElementById('world'),svg=document.getElementById('svg'),status=document.getElementById('status'),zl=document.getElementById('zlabel');
function send(){state.viewport={zoom:state.viewport.zoom,scrollLeft:c.scrollLeft,scrollTop:c.scrollTop};parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{nodes:state.nodes,edges:state.edges,selected,viewport:state.viewport}},'*')}
function frame(h=860){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}
function snap(){return JSON.stringify({nodes:state.nodes,edges:state.edges})}function checkpoint(){undo.push(snap());if(undo.length>50)undo.shift();redo=[]}function restore(s){let x=JSON.parse(s);state.nodes=x.nodes;state.edges=x.edges;selected=null;invalidate('Network edit');render();send()}function uid(){return Math.random().toString(36).slice(2,10)}
function invalidate(msg){state.p={};state.q={};state.solve={status:'UNSOLVED',message:msg||'Network changed'};updateStatus()}
function defaults(k){let n={id:uid(),kind:k,name:(k==='reservoir'?'TANK':k.toUpperCase())+'-'+(state.nodes.length+1),pressure_bar:null,x:80+(state.nodes.length%4)*220,y:80+Math.floor(state.nodes.length/4)*140,params:{}};if(k==='reservoir')n.params={reservoir_pressure_bar:250,pore_volume_m3:2000000,total_compressibility_1bar:8e-5,min_pressure_bar:20};if(k==='well')n.params={reservoir_pressure_bar:220,ipr_model:'PI',pi_m3d_bar:10,qmax_m3d:1500,initial_pressure_bar:80,initial_rate_m3d:500,depth_m:2000,tubing_id_m:.0889,tubing_roughness_m:4.5e-5,temperature_c:70,water_cut:.2,gor_sm3sm3:100,api:35,gas_sg:.75,correlation:'Beggs-Brill'};if(['sink','separator','separator_stage','oil_export','gas_export','water_disposal'].includes(k))n.pressure_bar=35;if(['water_source','gas_source'].includes(k))n.pressure_bar=180;if(['water_injector','gas_injector'].includes(k))n.params={injection_fluid:k==='water_injector'?'water':'gas',initial_pressure_bar:120};return n}
function edgeDefault(a,b){return {id:uid(),source:a,target:b,kind:'pipeline',length_m:1000,diameter_m:.154,roughness_m:4.5e-5,elevation_change_m:0,params:{temperature_c:50,water_cut:.2,gor_sm3sm3:100,api:35,gas_sg:.75,initial_rate_m3d:500,correlation:'Beggs-Brill',cv:80,shutoff_head_bar:35,rated_rate_m3d:1500,efficiency:.75,pressure_ratio:1.8,max_discharge_bar:250,max_rate_m3d:3000}}}
TYPES.forEach(([k,label])=>{let b=document.createElement('button');b.textContent='+ '+label;b.onclick=()=>{checkpoint();state.nodes.push(defaults(k));invalidate('Component added');render();send()};document.getElementById('pal').appendChild(b)})
function applyZoom(z,keepCenter=true){z=Math.max(.35,Math.min(2.5,z));let old=state.viewport.zoom||1,cx=(c.scrollLeft+c.clientWidth/2)/old,cy=(c.scrollTop+c.clientHeight/2)/old;state.viewport.zoom=z;world.style.transform=`scale(${z})`;world.style.width=(2400/z)+'px';world.style.height=(1600/z)+'px';zl.textContent=Math.round(z*100)+'%';if(keepCenter){c.scrollLeft=cx*z-c.clientWidth/2;c.scrollTop=cy*z-c.clientHeight/2}}
function updateStatus(){let s=state.solve||{status:'UNSOLVED'},t=s.status||'UNSOLVED';status.className='status '+(t==='SOLVED'?'solved':t==='FAILED'?'failed':'unsolved');status.textContent=t+(s.quality_gate?' • '+s.quality_gate:'')+(s.message?' — '+s.message:'')}
function render(){world.querySelectorAll('.node').forEach(x=>x.remove());svg.innerHTML='';let els={};state.nodes.forEach(n=>{let e=document.createElement('div');e.className='node'+(selected===n.id?' sel':'');e.style.left=(+n.x||20)+'px';e.style.top=(+n.y||20)+'px';let label=n.kind==='reservoir'?'reservoir tank':n.kind;e.innerHTML=`<div class=kind>${label}</div><b>${n.name}</b><span class="port pin"></span><span class="port pout ${connectFrom===n.id?'connecting':''}"></span><div class=result>${state.p[n.id]!=null?Number(state.p[n.id]).toFixed(1)+' bar':(state.solve.status==='FAILED'?'solve failed':'unsolved')}</div>`;e.onclick=ev=>{if(ev.target.classList.contains('port'))return;selected=n.id;render()};let pin=e.querySelector('.pin'),pout=e.querySelector('.pout');pout.onclick=ev=>{ev.stopPropagation();connectFrom=n.id;status.textContent='CONNECT — '+n.name+' OUT → target IN';render()};pin.onclick=ev=>{ev.stopPropagation();if(connectFrom&&connectFrom!==n.id){checkpoint();state.edges.push(edgeDefault(connectFrom,n.id));connectFrom=null;invalidate('Connection added');render();send()}};let drag=null;e.onpointerdown=ev=>{if(ev.target.classList.contains('port'))return;e.setPointerCapture(ev.pointerId);drag={x:ev.clientX,y:ev.clientY,l:+n.x||0,t:+n.y||0};checkpoint()};e.onpointermove=ev=>{if(!drag)return;let z=state.viewport.zoom||1;n.x=drag.l+(ev.clientX-drag.x)/z;n.y=drag.t+(ev.clientY-drag.y)/z;e.style.left=n.x+'px';e.style.top=n.y+'px';draw(els)};e.onpointerup=()=>{if(!drag)return;drag=null;invalidate('Node moved');send()};world.appendChild(e);els[n.id]=e});draw(els);updateStatus()}
function draw(els){svg.innerHTML='';svg.setAttribute('width',2400);svg.setAttribute('height',1600);state.edges.forEach(ed=>{let a=els[ed.source],b=els[ed.target];if(!a||!b)return;let x1=a.offsetLeft+a.offsetWidth,y1=a.offsetTop+34,x2=b.offsetLeft,y2=b.offsetTop+34,dx=Math.max(45,Math.abs(x2-x1)/2);let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);p.setAttribute('class','edge'+(selected===ed.id?' sel':''));p.onclick=()=>{selected=ed.id;render()};svg.appendChild(p);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(x1+x2)/2);t.setAttribute('y',(y1+y2)/2-5);t.setAttribute('class','edgeText');t.textContent=ed.kind+(state.q[ed.id]!=null?' • '+Number(state.q[ed.id]).toFixed(0)+' m³/d':'');svg.appendChild(t)})}
document.getElementById('del').onclick=()=>{if(!selected)return;checkpoint();if(state.nodes.some(n=>n.id===selected)){state.nodes=state.nodes.filter(n=>n.id!==selected);state.edges=state.edges.filter(e=>e.source!==selected&&e.target!==selected)}else state.edges=state.edges.filter(e=>e.id!==selected);selected=null;invalidate('Component deleted');render();send()};document.getElementById('copy').onclick=()=>{let n=state.nodes.find(n=>n.id===selected);if(!n)return;checkpoint();let z=JSON.parse(JSON.stringify(n));z.id=uid();z.name+=' COPY';z.x=(+z.x||0)+35;z.y=(+z.y||0)+35;state.nodes.push(z);selected=z.id;invalidate('Component copied');render();send()};document.getElementById('undo').onclick=()=>{if(!undo.length)return;redo.push(snap());restore(undo.pop())};document.getElementById('redo').onclick=()=>{if(!redo.length)return;undo.push(snap());restore(redo.pop())};
document.getElementById('zin').onclick=()=>{applyZoom((state.viewport.zoom||1)*1.2);send()};document.getElementById('zout').onclick=()=>{applyZoom((state.viewport.zoom||1)/1.2);send()};document.getElementById('reset').onclick=()=>{applyZoom(1,false);c.scrollLeft=0;c.scrollTop=0;send()};document.getElementById('fit').onclick=()=>{if(!state.nodes.length)return;let minx=Math.min(...state.nodes.map(n=>+n.x||0)),maxx=Math.max(...state.nodes.map(n=>(+n.x||0)+180)),miny=Math.min(...state.nodes.map(n=>+n.y||0)),maxy=Math.max(...state.nodes.map(n=>(+n.y||0)+100));let z=Math.min(c.clientWidth/(maxx-minx+100),c.clientHeight/(maxy-miny+100),1.5);applyZoom(z,false);c.scrollLeft=Math.max(0,(minx-50)*z);c.scrollTop=Math.max(0,(miny-50)*z);send()};
let pan=null;c.onpointerdown=ev=>{if(!ev.shiftKey||ev.target!==c)return;pan={x:ev.clientX,y:ev.clientY,l:c.scrollLeft,t:c.scrollTop};c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(!pan)return;c.scrollLeft=pan.l-(ev.clientX-pan.x);c.scrollTop=pan.t-(ev.clientY-pan.y)};c.onpointerup=()=>{if(pan){pan=null;send()}};
window.addEventListener('message',ev=>{let d=ev.data;if(d.type!=='streamlit:render')return;let a=d.args||{};state.nodes=JSON.parse(JSON.stringify(a.nodes||[]));state.edges=JSON.parse(JSON.stringify(a.edges||[]));state.p=a.pressures||{};state.q=a.rates||{};state.solve=a.solve_state||{status:Object.keys(state.p).length?'SOLVED':'UNSOLVED'};state.viewport=a.viewport||state.viewport;render();applyZoom(Number(state.viewport.zoom)||1,false);setTimeout(()=>{c.scrollLeft=Number(state.viewport.scrollLeft)||0;c.scrollTop=Number(state.viewport.scrollTop)||0},0);frame(a.height||860)});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');frame();
</script></body></html>
